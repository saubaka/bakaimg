<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}body{padding:20px;background:var(--milk);}</style><body class="ba-root"><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:640px"><label class="ba-field">名字<input class="ba-input" placeholder="例如：小树"></label><label class="ba-field">邮箱地址<input class="ba-input" aria-invalid="true" value="bad"><span class="ba-field__error">邮箱地址格式不正确</span></label><label class="ba-field">每页邮件数<span class="ba-select">50</span></label><div class="ba-field">启用 Turnstile<span class="ba-switch is-on" role="switch" aria-checked="true"></span></div></div></body>
