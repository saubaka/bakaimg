{% extends "layouts/admin.html" %}
{% block title %}{{ system_name }}｜后台｜角色{% endblock %}
{% block admin_title %}角色与权限{% endblock %}
{% block admin_content %}
  <div class="section-heading"><h2 class="ba-heading">内置角色</h2></div>
  <div class="role-grid">
    {% for role in roles %}
      <article class="ba-panel role-card"><h3 class="ba-heading">{{ role.name }}</h3><p>{{ role.description }}</p><strong>{{ role.permissions|length }} 项权限</strong><a class="ba-button ba-button--soft u-full" href="{{ url_for('admin.edit_role', role_id=role.id) }}">查看与编辑</a></article>
    {% endfor %}
  </div>
{% endblock %}
