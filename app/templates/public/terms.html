{% extends "layouts/site.html" %}
{% block title %}使用说明 · {{ site_name }}{% endblock %}
{% block content %}
  <div class="page-shell policy-shell">
    <section class="card policy-card" data-reveal>
      <span class="eyebrow">使用说明</span>
      <h1>一起维护良好的分享环境</h1>
      <p>请只上传自己有权保存和分享的图片，也请尊重他人的隐私与作品。</p>
      <h2>图片可见范围</h2>
      <p>仅自己可见的图片不会公开；通过链接分享的图片只会交给拿到链接的人；公开图片可能出现在画廊和相册中。</p>
      <h2>内容管理</h2>
      <p>不合适的内容可能会被隐藏或移除。整理期间，部分页面也可能暂时无法访问。</p>
    </section>
  </div>
{% endblock %}
