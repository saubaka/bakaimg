{% extends "layouts/site.html" %}
{% block title %}{{ site_name }}｜正在前往登录{% endblock %}
{% block content %}
  <section class="page-shell gateway-call-waiting" data-gateway-auto-continue data-continue-url="{{ continue_url }}" data-continue-delay="1100">
    <div class="gateway-call-waiting__card" data-reveal>
      <div class="gateway-call-waiting__visual" aria-hidden="true">
        <span class="brand-mark"><i></i><i></i></span>
      </div>
      <h1 class="ba-title">正在打开登录页面…</h1>
      <p class="ba-lead">完成登录后，你会自动回到刚才的位置。</p>
      <div class="gateway-call-steps">
        <span class="ba-badge ba-badge--ok">准备好了</span>
        <span class="ba-badge">前往登录</span>
        <span class="ba-badge">返回首页</span>
      </div>
      <a class="ba-button" href="{{ continue_url }}">现在前往</a>
    </div>
  </section>
{% endblock %}
